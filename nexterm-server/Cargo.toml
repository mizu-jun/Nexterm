[package]
name = "nexterm-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# ライブラリとバイナリの両方をビルドする
# GPU クライアントがライブラリとしてリンクしてシングルバイナリを実現する
[lib]
name = "nexterm_server"
path = "src/lib.rs"

[[bin]]
name = "nexterm-server"
path = "src/main.rs"

[dependencies]
nexterm-proto = { path = "../nexterm-proto" }
nexterm-vt = { path = "../nexterm-vt" }
nexterm-config = { path = "../nexterm-config" }
nexterm-ssh = { path = "../nexterm-ssh" }
nexterm-plugin = { path = "../nexterm-plugin" }
tokio = { workspace = true }
portable-pty = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
serde_json = { workspace = true }

serialport = { workspace = true }
toml_edit = { workspace = true }
arc-swap = { workspace = true }
notify = { workspace = true }
zeroize = "1.8"
axum = { version = "0.7", features = ["ws"] }
# G4: 0.4 → 0.5 with "util" for `ServiceExt::oneshot` in the web-auth
# integration tests (matches the tower version axum links against).
tower = { version = "0.5", features = ["util"] }
rust-embed = { version = "8", features = ["include-exclude"] }

# TOTP authentication
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
rand = "0.9"
# 定数時間比較（タイミング攻撃対策、TOTP コード比較・リプレイ検出で使用）
subtle = "2.6"

# OAuth2 / OIDC 認証
oauth2 = { version = "5", features = ["reqwest"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# HTTPS / TLS
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
tokio-rustls = "0.26"
rustls = "0.23"
# G5: rustls-pemfile (archived 2025-08, RUSTSEC-2025-0134) was replaced by the
# PemObject API in rustls-pki-types.
rustls-pki-types = { version = "1", features = ["std"] }
rcgen = "0.13"

# アクセスログのローテーション時 gzip 圧縮（Sprint 3-3 後半）
flate2 = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
dirs = "5"
# Sprint 5-10 Phase 4-7: has_foreground_process の Windows 実装で使用
# CreateToolhelp32Snapshot + Process32FirstW/NextW で子プロセスを走査する。
# client-gpu と同じバージョンに揃えて Cargo.lock の重複を避ける。
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
# Sprint 4-4: BSP レイアウト・タイリング・スナップショット往復のプロパティテスト
proptest = { workspace = true }
# F2: compile WAT fixtures to real WASM for plugin IPC dispatch integration tests.
wat = { workspace = true }

[lints]
workspace = true
